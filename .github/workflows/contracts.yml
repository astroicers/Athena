name: contracts

# Prove the teaching artifacts actually hold up against the in-repo ecosystem:
#   - the extension-guide scorer snippet compiles against sdk/
#   - every example manifest validates against tools/schema/
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'tools/**'
      - 'ci/**'
      - 'examples/**'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorer-snippet:
    name: scorer snippet compiles (in-repo SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ci/scorer-check
      - name: cargo build
        working-directory: ci/scorer-check
        run: cargo build

  manifest-schema:
    name: example manifests validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: pip install check-jsonschema
      - name: Validate example manifests against in-repo schema
        run: |
          set -euo pipefail
          fail=0
          for m in $(git ls-files 'examples/**/athena-tool.toml' 'tools/examples/**/athena-tool.toml'); do
            echo "validating $m"
            python -c "import tomllib,json; json.dump(tomllib.load(open('$m','rb')), open('/tmp/m.json','w'))"
            check-jsonschema --schemafile tools/schema/athena-tool.schema.json /tmp/m.json || fail=1
          done
          exit "$fail"
