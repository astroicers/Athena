# SPDX-License-Identifier: Apache-2.0
[package]
name = "athena-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
description = "Stable Rust contract traits for building hot-pluggable Athena OODA modules (open-core SDK)."
repository = "https://github.com/astroicers/athena-sdk"
documentation = "https://docs.rs/athena-sdk"
readme = "README.md"
keywords = ["ooda", "security", "orchestration", "traits", "sdk"]
categories = ["api-bindings"]
publish = true

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
toml = "0.8"
