# Example Athena tool manifest.
# Phase 1: external tools are targetless (OSINT / query). A tool needing victim-IP injection
# (target_param / scope-target) is Phase 2. Validate with schema/athena-tool.schema.json.
manifest_version = "1"

tool_name    = "example_query"
container    = "example-osint"
port         = 9130
techniques   = ["T1596"]                       # MITRE ATT&CK: Search Open Technical Databases
description  = "Targetless OSINT lookup (example community tool)"
phase        = "observe"
os_hint      = "any"
params_hint  = "domain=<name>"
sensitive    = false
